name: bankflow-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/Web/bankflow-web/package-lock.json

      - name: Restore
        run: dotnet restore BankFlow.slnx -p:NuGetAudit=true -p:NuGetAuditMode=all

      - name: Build
        run: dotnet build BankFlow.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test --solution BankFlow.slnx --configuration Release --no-build --results-directory TestResults

      - name: Install portal dependencies
        working-directory: src/Web/bankflow-web
        run: npm ci

      - name: Audit portal runtime dependencies
        working-directory: src/Web/bankflow-web
        run: npm audit --omit=dev --audit-level=high

      - name: Lint portal
        working-directory: src/Web/bankflow-web
        run: npm run lint

      - name: Build portal
        working-directory: src/Web/bankflow-web
        run: npm run build

      - name: Validate Compose
        run: docker compose --env-file .env.example config --quiet

      - name: Build container images
        run: |
          docker compose --env-file .env.example build gateway
          docker compose --env-file .env.example build identity
          docker compose --env-file .env.example build accounts
          docker compose --env-file .env.example build transfers
          docker compose --env-file .env.example build admin

      - name: Accounts vulnerable dependencies
        run: dotnet list BankFlow.slnx package --vulnerable --include-transitive

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults
          if-no-files-found: ignore
          retention-days: 14
