apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin
spec:
  replicas: 2
  selector:
    matchLabels:
      app: admin
  template:
    metadata:
      labels:
        app: admin
    spec:
      automountServiceAccountToken: false
      containers:
        - name: admin
          image: ghcr.io/seu-usuario/bankflow-web:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
            - name: NEXT_TELEMETRY_DISABLED
              value: "1"
            - name: PORT
              value: "3000"
            - name: HOSTNAME
              value: 0.0.0.0
            - name: BANKFLOW_GATEWAY_URL
              value: http://gateway:80
            - name: BANKFLOW_IDENTITY_URL
              value: http://identity:8080
            - name: BANKFLOW_TRANSFERS_URL
              value: http://transfers:8080
            - name: BANKFLOW_ACCOUNTS_URL
              value: http://accounts:8080
            - name: BANKFLOW_COOKIE_SECURE
              value: "true"
            - name: ASPIRE_DASHBOARD_PUBLIC_URL
              value: https://observability.bankflow.example
            - name: RABBITMQ_MANAGEMENT_PUBLIC_URL
              value: https://rabbitmq.bankflow.example
          readinessProbe:
            httpGet:
              path: /api/health/live
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: admin
spec:
  selector:
    app: admin
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: admin
  annotations:
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - portal.bankflow.example
      secretName: bankflow-portal-tls
  rules:
    - host: portal.bankflow.example
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: admin
                port:
                  name: http
