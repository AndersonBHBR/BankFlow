apiVersion: v1
kind: ConfigMap
metadata:
  name: bankflow-config
data:
  ASPNETCORE_ENVIRONMENT: Production
  ASPNETCORE_URLS: http://+:8080
  Jwt__Issuer: bankflow.identity
  Jwt__Audience: bankflow.apis
  Services__AccountsBaseUrl: http://accounts:8080/
  RabbitMq__Host: rabbitmq.example.internal
  RabbitMq__Port: "5671"
  RabbitMq__UseTls: "true"
  RabbitMq__Username: bankflow
  RabbitMq__VirtualHost: bankflow
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector.observability:4317
  OTEL_EXPORTER_OTLP_PROTOCOL: grpc
  OTEL_RESOURCE_ATTRIBUTES: deployment.environment=production,service.namespace=bankflow
  ReverseProxy__Clusters__identity__Destinations__primary__Address: http://identity:8080
  ReverseProxy__Clusters__transfers__Destinations__primary__Address: http://transfers:8080
  ReverseProxy__Clusters__accounts__Destinations__primary__Address: http://accounts:8080
