apiVersion: apps/v1
kind: Deployment
metadata:
  name: transfers
spec:
  replicas: 2
  selector:
    matchLabels:
      app: transfers
  template:
    metadata:
      labels:
        app: transfers
    spec:
      automountServiceAccountToken: false
      containers:
