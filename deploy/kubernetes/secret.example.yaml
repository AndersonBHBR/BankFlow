# Exemplo apenas. Não versione segredos reais; crie bankflow-secrets no cofre do cluster.
apiVersion: v1
kind: Secret
metadata:
  name: bankflow-secrets
  namespace: bankflow
type: Opaque
stringData:
  Jwt__SigningKey: substitua-por-um-segredo-aleatorio-com-32-bytes-ou-mais
  RabbitMq__Password: substitua-pelo-segredo-do-broker
  ConnectionStrings__TransfersDatabase: Server=transfers-sql.example.internal,1433;Database=BankFlowTransfers;User Id=bankflow;Password=SUBSTITUA;Encrypt=True;TrustServerCertificate=False
  ConnectionStrings__AccountsDatabase: Server=accounts-sql.example.internal,1433;Database=BankFlowAccounts;User Id=bankflow;Password=SUBSTITUA;Encrypt=True;TrustServerCertificate=False
